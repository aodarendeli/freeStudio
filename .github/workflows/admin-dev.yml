name: Deploy admin (dev)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "apps/admin/**"
      - "packages/**"
      - "deploy/docker-compose.dev.yml"
      - ".github/workflows/admin-dev.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/aodarendeli/freestudio-admin

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://api.freestudio.site
          tags: |
            ${{ env.IMAGE }}:dev
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up deploy SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "89.252.179.67 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEpxNjepIanhMxvNfke3dAAQ/RWG7jdyTHy5jMwTGeAy" > ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          scp deploy/docker-compose.dev.yml ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}:/home/ahmet/freestudio-dev/docker-compose.yml
          ssh ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }} \
            "cd /home/ahmet/freestudio-dev && docker compose pull admin-dev && docker compose up -d admin-dev"
